# Hourly refresh of the live layers (NOWCAST + FORECAST preview), committed into web/public/data/sample so Vercel redeploys.
# The website now lives in this repo (web/), so no second repo and no secret is needed: the built-in GITHUB_TOKEN pushes the commit.
# Each script keeps its previous output when it fails, so a failed fetch leaves the last good files (their own `stale` flags then show the age).
# Manual setup: see docs/live_refresh_setup.md (Actions write permission, Vercel root directory = web, deploy from the default branch).
name: refresh-live
on:
  schedule: [{cron: "37 * * * *"}]   # offset from nwm-live (minute 17)
  workflow_dispatch:
permissions: {contents: write}
concurrency: refresh-live
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install netCDF4 numpy pandas pyarrow requests
      - name: nowcast (river gauges + coastal)
        run: python src/live/45_nowcast.py
        continue-on-error: true
      - name: forecast preview
        run: python src/live/44_forecast_preview.py
        continue-on-error: true
      - name: copy into the site and commit
        run: |
          cp export/sample/nowcast.json export/sample/coastal.json export/sample/forecast_latest.json web/public/data/sample/
          git config user.name refresh-bot && git config user.email refresh-bot@users.noreply.github.com
          git add web/public/data/sample/nowcast.json web/public/data/sample/coastal.json web/public/data/sample/forecast_latest.json
          git diff --cached --quiet || (git commit -m "live data $(date -u +%FT%HZ)" && git pull --rebase && git push)
